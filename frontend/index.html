<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swarm Assembly — Self-Assembling Agent Teams on DGX Spark</title>
<style>
  :root {
    --bg:#080b11; --panel:#111721; --edge:#1e2836; --text:#e6edf3; --dim:#7d8896;
    --gold:#ffcf33; --blue:#2fb8ff; --purple:#c186ff; --nv:#76B900; --accent:#76e0c2;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif; height:100vh; overflow:hidden; }
  header { padding:14px 22px; border-bottom:1px solid var(--edge);
    display:flex; align-items:center; gap:14px; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .badge { font-size:11.5px; color:var(--dim); border:1px solid var(--edge);
    padding:4px 10px; border-radius:6px; background:rgba(255,255,255,0.02); }
  header .llm { margin-left:auto; font-size:12px; display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .dot.ok { background:var(--nv); box-shadow:0 0 8px var(--nv); }
  main { display:grid; grid-template-columns:1.55fr 1fr; height:calc(100vh - 53px); }
  #stage { position:relative; min-width:0; }
  canvas { width:100%; height:100%; display:block; }
  #phase { position:absolute; top:12px; left:50%; transform:translateX(-50%);
    font-size:12px; font-weight:600; color:var(--accent); letter-spacing:2px;
    text-transform:uppercase; padding:3px 12px; border-radius:12px;
    background:rgba(8,11,17,0.75); border:1px solid rgba(118,224,194,0.22);
    pointer-events:none; }
  #phase:empty { display:none; }

  aside { border-left:1px solid var(--edge); display:flex; flex-direction:column;
    min-width:0; height:100%; overflow:hidden; background:#0b0f17; }
  .pane-hdr { padding:8px 14px; font-size:11px; font-weight:600; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--edge);
    background:rgba(255,255,255,0.02); display:flex; align-items:center; justify-content:space-between; }

  /* Always-visible, high-contrast custom scrollbars for Activity Feed, Final Report, and Tasks */
  .scroll-pane { scrollbar-width:thin; scrollbar-color:#2e3f57 #0d131d; }
  .scroll-pane::-webkit-scrollbar { width:10px; height:10px; }
  .scroll-pane::-webkit-scrollbar-track { background:#0d131d; border-left:1px solid var(--edge); }
  .scroll-pane::-webkit-scrollbar-thumb { background:#2e3f57; border-radius:5px; border:2px solid #0d131d; }
  .scroll-pane::-webkit-scrollbar-thumb:hover { background:var(--blue); }

  #feed { flex:1; min-height:0; overflow-y:scroll; padding:12px 14px;
    font-family:'SF Mono',Consolas,monospace; font-size:12.5px; line-height:1.55; }
  .msg { margin-bottom:5px; word-wrap:break-word; padding:3px 6px; border-radius:5px; }
  .msg .who { font-weight:600; }
  .msg.exec { color:var(--accent); background:rgba(118,224,194,0.05); border-left:2px solid var(--accent); }
  .msg.reason { color:#9aa6b5; font-style:italic; background:rgba(255,255,255,0.025);
    border-left:2px solid #3c4b5e; cursor:pointer; user-select:text; }
  .msg.reason:hover { border-left-color:var(--blue); background:rgba(47,184,255,0.05); }
  .msg.reason .r-toggle { font-style:normal; font-size:10.5px; color:var(--blue);
    margin-left:6px; opacity:0.85; }
  .msg.reason.collapsed .r-body { display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden; }

  #report { border-top:1px solid var(--edge); padding:14px 16px; max-height:38%;
    overflow-y:auto; background:var(--panel); font-size:13.5px; line-height:1.6; display:none; }
  #report h3 { margin:0 0 8px; font-size:12px; color:var(--nv); letter-spacing:1px; text-transform:uppercase; }
  #reportbody p { margin:0 0 8px; }
  #reportbody p:last-child { margin-bottom:0; }
  #reportbody ul, #reportbody ol { margin:4px 0 8px 20px; padding:0; }
  #reportbody li { margin-bottom:3px; }
  #reportbody code { font-family:'SF Mono',Consolas,monospace; font-size:12px;
    background:rgba(255,255,255,0.07); padding:1px 5px; border-radius:4px; color:var(--accent); }
  #reportbody strong { color:#fff; }

  #controls-wrap { border-top:1px solid var(--edge); background:#0d131d; display:flex; flex-direction:column; max-height:165px; }
  #controls { padding:10px 14px; overflow-y:auto; display:grid;
    grid-template-columns:repeat(auto-fill, minmax(175px, 1fr)); gap:8px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--edge);
    padding:9px 12px; border-radius:8px; font-size:12.5px; font-weight:500;
    cursor:pointer; transition:.15s; text-align:left; display:flex; align-items:center; gap:6px; }
  button:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); background:rgba(47,184,255,0.06); }
  button:disabled { opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>🐝 Swarm Assembly</h1>
  <span class="badge">Supervisor + 8 specialists</span>
  <span class="badge">Nemotron-3-Super-120B (TP=2 · 200GbE CX7) · 2× DGX Spark</span>
  <span class="llm"><span class="dot" id="llmdot"></span><span id="llmtxt">checking…</span></span>
</header>
<main>
  <section id="stage">
    <div id="phase"></div>
    <canvas id="canvas"></canvas>
  </section>
  <aside>
    <div class="pane-hdr">
      <span>Live Activity &amp; Reasoning Feed</span>
      <span id="feedHint" style="font-weight:400;text-transform:none;letter-spacing:0">click any 💭 thought to expand · click node to filter</span>
    </div>
    <div id="feed" class="scroll-pane"></div>
    <div id="report" class="scroll-pane"><h3>Final Result</h3><div id="reportbody"></div></div>
    <div id="controls-wrap">
      <div class="pane-hdr"><span>Run Swarm Task</span><span id="runstatus" style="color:var(--accent)">idle</span></div>
      <div id="controls" class="scroll-pane"></div>
    </div>
  </aside>
</main>
<script src="/static/swarm.js"></script>
</body>
</html>
