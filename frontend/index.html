<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swarm Assembly — Self-Assembling Agent Teams on DGX Spark</title>
<style>
  :root {
    --bg:#080b11; --panel:#111721; --edge:#1e2836; --text:#e6edf3; --dim:#7d8896;
    --gold:#ffcf33; --blue:#2fb8ff; --purple:#c186ff; --nv:#76B900; --accent:#76e0c2;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif; height:100vh; overflow:hidden; }
  header { padding:14px 22px; border-bottom:1px solid var(--edge);
    display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .badge { font-size:11px; color:var(--dim); border:1px solid var(--edge);
    padding:3px 8px; border-radius:6px; }
  header .llm { margin-left:auto; font-size:12px; display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .dot.ok { background:var(--nv); box-shadow:0 0 8px var(--nv); }
  main { display:grid; grid-template-columns:1.5fr 1fr; height:calc(100vh - 53px); }
  #stage { position:relative; }
  canvas { width:100%; height:100%; display:block; }
  #phase { position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-size:13px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; }
  aside { border-left:1px solid var(--edge); display:flex; flex-direction:column; min-width:0; }
  #feed { flex:1; overflow-y:auto; padding:12px 14px;
    font-family:'SF Mono',Consolas,monospace; font-size:12.5px; line-height:1.5; }
  .msg { margin-bottom:3px; word-wrap:break-word; }
  .msg .who { font-weight:600; }
  .msg.exec { color:var(--accent); }
  .msg.reason { color:var(--dim); font-style:italic; }
  #report { border-top:1px solid var(--edge); padding:14px; max-height:34%; overflow-y:auto;
    background:var(--panel); font-size:13.5px; line-height:1.55; display:none; }
  #report h3 { margin:0 0 8px; font-size:12px; color:var(--nv); letter-spacing:1px; text-transform:uppercase; }
  #controls { padding:12px 14px; border-top:1px solid var(--edge); display:flex; flex-wrap:wrap; gap:8px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--edge);
    padding:9px 14px; border-radius:8px; font-size:13px; cursor:pointer; transition:.15s; }
  button:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }
  button:disabled { opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>🐝 Swarm Assembly</h1>
  <span class="badge">Supervisor + 8 specialists</span>
  <span class="badge">Nemotron 3.5 Lightning · DGX Spark</span>
  <span class="llm"><span class="dot" id="llmdot"></span><span id="llmtxt">checking…</span></span>
</header>
<main>
  <section id="stage">
    <div id="phase"></div>
    <canvas id="canvas"></canvas>
  </section>
  <aside>
    <div id="feed"></div>
    <div id="report"><h3>Final Result</h3><div id="reportbody"></div></div>
    <div id="controls"></div>
  </aside>
</main>
<script src="/static/swarm.js"></script>
</body>
</html>
